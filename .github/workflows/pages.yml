name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install -r scripts/requirements-images.txt
      - name: Cache image previews
        uses: actions/cache@v6
        with:
          path: .cover-cache
          key: ${{ runner.os }}-image-previews-v1-${{ hashFiles('scripts/optimize-covers.py', 'scripts/requirements-images.txt', '_albums/**', 'assets/photos/**') }}
          restore-keys: |
            ${{ runner.os }}-image-previews-v1-
      - name: Build website
        uses: actions/jekyll-build-pages@v1
        env:
          SKIP_COVER_PREVIEWS: '1'
        with:
          source: ./
          destination: ./_site
      - name: Generate image previews
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          python scripts/optimize-covers.py --source . --destination _site --baseurl "$PAGES_BASE_PATH"
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
